name: Kaltura AEM Integration CI

on:
  push:
    branches: [ main, develop ] # Adjust as per your branching strategy
  pull_request:
    branches: [ main, develop ]

jobs:
  aem-build-test:
    name: AEM Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Or your preferred JDK distribution
          java-version: '11'
          cache: 'maven'
      - name: Build and Test AEM Project
        run: mvn -B clean install
        working-directory: ./myaemproject # Assuming 'myaemproject' is the root of AEM code

  app-builder-build-test:
    name: App Builder Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Or your preferred Node.js version
          cache: 'npm'
          cache-dependency-path: app-builder-actions/package-lock.json # Path to lock file
      - name: Install App Builder Dependencies
        run: npm ci # Use 'ci' for cleaner installs in CI
        working-directory: ./app-builder-actions # Assuming 'app-builder-actions' is root
      - name: Lint App Builder Code
        run: npm run lint
        working-directory: ./app-builder-actions
      - name: Test App Builder Code
        run: npm test
        working-directory: ./app-builder-actions
